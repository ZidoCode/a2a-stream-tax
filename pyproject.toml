[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-stream-tax"
version = "0.1.1"
description = "a2a-stream-tax"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "ZidoCode" }]
keywords = ["agents", "audit", "cli"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
a2a-stream-tax = "a2a_stream_tax:main"

[tool.setuptools]
py-modules = ["a2a_stream_tax", "a2a_tax"]
